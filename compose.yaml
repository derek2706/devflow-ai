services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devflow
      POSTGRES_PASSWORD: devflow_local_only
      POSTGRES_DB: devflow
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - devflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devflow -d devflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devflow_postgres:
